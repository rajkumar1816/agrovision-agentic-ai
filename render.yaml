services:
  - type: web
    name: agrovizion-ai
    env: node
    plan: free
    branch: master
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEFAULT_FARM_ID
        value: FARM001
